[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xiongmai-camera-bridge"
version = "1.0.0"
description = "DVRIP to MQTT bridge for Xiongmai (XMeye/XMSECU) PTZ cameras, with Home Assistant discovery"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "paho-mqtt>=2.0",
]

[project.optional-dependencies]
# needed by `xiongmai-ptz mark|check` to grab frames and compare them
measure = ["numpy>=1.24", "Pillow>=10", "av>=12"]

[project.scripts]
xiongmai-ptz = "xiongmai_bridge.cli:main"

[project.urls]
Homepage = "https://github.com/hametovbr/xiongmai-camera-bridge"

[tool.setuptools.packages.find]
include = ["xiongmai_bridge*"]
